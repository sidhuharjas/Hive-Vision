$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Hive Vision
  structure:
    - type: section
      key: section-get-started
      title: Get started
      path: get-started
      description: What Hive Vision detects, how the deployment tracks compare, and what to collect before you ship.
      icon: compass
      default: true
      children:
        - type: space
          key: space-overview
          title: Overview
          path: overview
          default: true
          content:
            directory: ./docs
    - type: section
      key: section-tracks
      title: Detector tracks
      path: detector-tracks
      description: The three ball-detection deployments — Limelight 3A (TFLite/ONNX), Control Hub OpenCV, and Control Hub Lab. Every page shows the detector running on real footage.
      icon: stack
      children:
        - type: space
          key: space-yolo
          title: Limelight 3A & ONNX
          path: limelight-yolo
          default: true
          content:
            directory: ./yolo
        - type: space
          key: space-cv
          title: Control Hub (OpenCV)
          path: control-hub-opencv
          content:
            directory: ./cv
        - type: space
          key: space-lab
          title: Control Hub (Lab)
          path: control-hub-lab
          content:
            directory: ./lab
    - type: section
      key: section-shipping
      title: Shipping
      path: shipping
      description: The pre-flight handbook — artifact manifest, three-track comparison, and the verified checklist that takes a robot from repo to field.
      icon: package
      children:
        - type: space
          key: space-shipping
          title: Deployment handbook
          path: handbook
          default: true
          content:
            directory: ./shipping