$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Hive Vision
  structure:
    - type: section
      key: section-get-started
      title: Get started
      path: get-started
      default: true
      children:
        - type: space
          key: space-overview
          title: Overview
          path: overview
          default: true
          content:
            directory: ./docs
    - type: section
      key: section-updates
      title: Updates
      path: updates
      children:
        - type: space
          key: space-updates
          title: Updates & releases
          path: updates-releases
          default: true
          content:
            directory: ./updates
